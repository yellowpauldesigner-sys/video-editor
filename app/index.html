<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="clips-token" content="__CLIPS_TOKEN__" />
    <title>uberdesigner clips</title>
    <meta name="description" content="Видеоредактор для дизайнеров: соберите клип о своей работе прямо в браузере." />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="app">
      <header class="top">
        <div class="brand"><span class="mark"></span><b>uberdesigner</b> clips</div>
        <select id="clips" class="clips" title="Клипы в этом браузере" aria-label="Клипы"></select>
        <input id="clipName" class="name" spellcheck="false" aria-label="Название клипа" />
        <span id="saved" class="saved"></span>
        <div class="grow"></div>
        <div id="formats" class="seg" role="tablist" aria-label="Формат кадра"></div>
        <button id="theme" class="icon" title="Светлая или тёмная тема" aria-label="Тема">◐</button>
        <button id="renderBtn" class="primary">Собрать видео</button>
      </header>

      <aside class="left">
        <div class="tabs" id="leftTabs">
          <button data-tab="layers" class="on">Слои</button>
          <button data-tab="media">Медиа</button>
          <button data-tab="history">История</button>
        </div>
        <div id="leftBody" class="body"></div>
      </aside>

      <main class="center">
        <div id="notice" class="notice" hidden></div>
        <div id="canvas" class="canvas">
          <div id="frameWrap" class="frameWrap">
            <canvas id="stage" width="1920" height="1080"></canvas>
            <div id="overlay" class="overlay"><div id="selBox" class="selBox" hidden><i data-h="scale"></i></div></div>
          </div>
          <div id="welcome" class="welcome" hidden></div>
          <div id="jobs" class="jobs"></div>
          <div id="drop" class="drop" hidden><div>Отпустите файлы: они попадут в медиа клипа</div></div>
        </div>
        <div class="transport">
          <button id="play" class="icon big" title="Пуск / пауза (пробел)" aria-label="Пуск">▶</button>
          <span id="time" class="time">00:00.00</span>
          <span class="dim">/</span>
          <span id="total" class="time dim">00:00.00</span>
          <button id="mute" class="icon" title="Звук в предпросмотре" aria-label="Звук">🔊</button>
          <div class="grow"></div>
          <button id="splitBtn" class="ghost" title="Разрезать сцену в этом месте (S)">Разрезать</button>
          <button id="zoomOut" class="icon" title="Мельче" aria-label="Мельче">−</button>
          <button id="zoomFit" class="ghost" title="Весь клип по ширине">Весь клип</button>
          <button id="zoomIn" class="icon" title="Крупнее" aria-label="Крупнее">+</button>
        </div>
        <div id="timeline" class="timeline"><div id="tlInner" class="tlInner"></div></div>
        <form id="chat" class="chat" hidden>
          <span id="chip" class="chip"></span>
          <textarea id="ask" rows="1" placeholder="Что изменить? Например: «сделай сцену короче и выведи цифру счётчиком»"></textarea>
          <select id="model" title="Модель Claude"></select>
          <button class="primary" id="send">Изменить</button>
        </form>
      </main>

      <aside class="right">
        <div class="tabs" id="rightTabs" hidden>
          <button data-tab="props" class="on">Свойства</button>
          <button data-tab="ai">AI-изменения<i id="aiDot" class="dot" hidden></i></button>
        </div>
        <div id="rightBody" class="body"></div>
      </aside>
    </div>
    <div id="pop" class="pop" hidden></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
